<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#083344" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#030712" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-opacity="0.4"/>

  <polygon points="256,64 394,144 394,304 256,384 118,304 118,144" 
           fill="#05121e" 
           fill-opacity="0.85" 
           stroke="url(#blueGrad)" 
           stroke-width="5" 
           stroke-linejoin="round"
           filter="url(#neonBloom)"/>

  <!-- Incursion 'I' Crown -->
  <path d="M 176 136 L 256 90 L 336 136 L 312 168 L 256 136 L 200 168 Z" 
        fill="url(#cyanGrad)"
        filter="url(#neonBloom)"/>

  <!-- Incursion 'I' Body Pillar -->
  <path d="M 230 180 L 282 180 L 290 320 L 256 348 L 222 320 Z" 
        fill="url(#coreGlow)"/>

  <!-- Center Pulse Gem -->
  <polygon points="256,220 286,245 286,275 256,300 226,275 226,245" 
           fill="#ecfeff" 
           stroke="#22d3ee" 
           stroke-width="3"/>
  
  <circle cx="256" cy="260" r="10" fill="#ffffff"/>

  <!-- Incursion 'I' Base -->
  <path d="M 176 376 L 256 422 L 336 376 L 312 344 L 256 376 L 200 344 Z" 
        fill="url(#cyanGrad)"
        filter="url(#neonBloom)"/>
</svg>
